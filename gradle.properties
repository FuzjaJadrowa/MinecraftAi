# Enable Gradle caching for faster subsequent builds
org.gradle.caching=true

# Enable parallel task execution for multi-threaded compilation and processing
org.gradle.parallel=true

# Enable configuration caching to reuse the configuration phase output
org.gradle.configuration-cache=true

# Set JVM settings for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -Dfile.encoding=UTF-8
